// Aion Download Manager: a standalone app (com.nath.aion.downloads). Aion can install it from its
// settings and hands downloads to it. Built separately: ../../gradlew -p . assembleRelease
plugins {
    id "com.android.application" version "9.4.0"
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.20"
}

android {
    namespace = "com.nath.aion.downloads"
    compileSdk { version = release(37) { minorApiLevel = 2 } }

    defaultConfig {
        applicationId = "com.nath.aion.downloads"
        minSdk = 26
        targetSdk = 35
        versionCode = 4
        versionName = "0.1.3"
        ndk { abiFilters += ["arm64-v8a"] }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles = [getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"]
            signingConfig = signingConfigs.debug
        }
    }

    buildFeatures { compose = true }

    packaging { jniLibs { useLegacyPackaging = false } }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    implementation "org.libtorrent4j:libtorrent4j:2.1.0-39"
    implementation "org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39"
    // YouTube stream links (GPL-3.0, private use only; see ROADMAP "Before publishing")
    implementation "com.github.TeamNewPipe:NewPipeExtractor:v0.26.5"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
}
