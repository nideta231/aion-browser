name: Build Aion

# Builds Aion Downloads + the site-app template (bundled as assets), then Aion itself (forkRelease, arm64),
# signs everything with the same key used for local builds, and uploads the APKs.
# Push a tag "aion-X.Y.Z" to also publish a GitHub release.

on:
  push:
    branches: [aion]
    tags: ['aion-*']
    paths-ignore: ['**.md', 'docs/**', 'aion-tools/research/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. aion-0.3.0 (default: aion-<short sha>)'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  JAVA_TOOL_OPTIONS: -XX:+UseParallelGC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL &
          df -h / | tail -1

      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/build.yml

      - name: Signing key (repo secret, falls back to a throwaway debug key)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_B64 not set: APKs are signed with a new key and won't update existing installs"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000 >/dev/null
          fi

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" >/dev/null \
            || echo "::warning::sdkmanager failed, AGP will try to download the platform itself"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare tree (android-components patch, glean venv)
        run: |
          git -C android-components apply --exclude='*/.gradle/*' ../patches/android-components-local.patch
          python -m venv venv
          venv/bin/pip install -q 'glean_parser~=20.1'
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.ref_type }}" = tag ]; then V="${{ github.ref_name }}"; fi
          [ -z "$V" ] && V="aion-$(git rev-parse --short HEAD)"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/aion' }}
          gradle-home-cache-cleanup: true

      - name: Fast build settings
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/ci.gradle <<'EOF'
          // CI only: skip lint-vital on release builds (lint is not a gate here; saves several minutes)
          allprojects {
            plugins.withId("com.android.application") { project.android.lint.checkReleaseBuilds = false }
          }
          EOF

      - name: Build Aion Downloads + site-app template (bundled assets)
        run: |
          ./gradlew -p aion-tools/download-manager assembleRelease --build-cache --parallel
          ./gradlew -p aion-tools/webapp-template assembleRelease --build-cache --parallel
          cp aion-tools/download-manager/build/outputs/apk/release/aion-download-manager-release.apk app/src/main/assets/aion-downloads.apk
          cp aion-tools/webapp-template/build/outputs/apk/release/aion-webapp-template-release.apk app/src/main/assets/webapp-template.apk

      - name: Build Aion (forkRelease, arm64)
        run: |
          ./gradlew app:assembleForkRelease -PversionName="$VERSION_NAME" \
            --build-cache --parallel --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx9g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC"

      - name: Sign
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out
          "$BT/zipalign" -f -p 4 gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease-unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out "out/Aion-${VERSION_NAME#aion-}-arm64.apk" out/aligned.apk
          rm out/aligned.apk out/*.idsig 2>/dev/null || true
          cp app/src/main/assets/aion-downloads.apk "out/AionDownloads-$(grep -oP 'versionName = "\K[^"]+' aion-tools/download-manager/build.gradle).apk"
          "$BT/apksigner" verify out/Aion-*.apk && ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: aion-${{ env.VERSION_NAME }}
          path: out/*.apk
          retention-days: 14
          compression-level: 0

      - name: GitHub release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "$GITHUB_REF_NAME" --generate-notes --prerelease
